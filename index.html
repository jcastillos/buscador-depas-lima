<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Depas Lima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Panel de Filtros -->
        <aside class="filtros">
            <h2>Mis Filtros</h2>
            
            <label>1. Distrito</label>
            <select id="distrito">
                <option value="miraflores">Miraflores</option>
                <option value="san isidro">San Isidro</option>
                <option value="surco">Santiago de Surco</option>
            </select>

            <label>2. Precio (S/)</label>
            <input type="number" id="precio-min" placeholder="Mínimo">
            <input type="number" id="precio-max" placeholder="Máximo">

            <label>3. Dormitorios</label>
            <input type="number" id="dormitorios" placeholder="Ej: 3">

            <label>4. Baños</label>
            <input type="number" id="banos" placeholder="Ej: 2">

            <label>5. Área Techada (m²)</label>
            <input type="number" id="area-min" placeholder="Mínimo">
            <input type="number" id="area-max" placeholder="Máximo">

            <button id="btn-generar">Generar Enlaces</button>
        </aside>

        <!-- Panel de Resultados -->
        <main class="resultados">
            <!-- Capa 1: Enlaces Inteligentes -->
            <div class="tarjeta-info">
                <h2>🔗 CAPA 1: Enlaces Inteligentes</h2>
                <div id="enlaces-portales">
                    <p style="color: #666;">Configura tus filtros y presiona Buscar.</p>
                </div>
            </div>

            <!-- Capa 2: Panel de Estado del Robot -->
            <div id="panel-estado" class="tarjeta-info oculto">
                <h2>📡 Estado de los Portales (Robot)</h2>
                <ul id="lista-estado" style="list-style: none; padding: 0;"></ul>
            </div>

            <!-- Capa 3: Tarjetas Deduplicadas -->
            <div id="caja-tarjetas" class="caja-tarjetas oculto">
                <h2>🏆 CAPA 2 y 3: Resultados Unificados</h2>
                <!-- Las tarjetas se inyectarán aquí -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
