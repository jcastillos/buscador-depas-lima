name: Scraping Diario Inmobiliario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  buscar-depas:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 📦 Instalar librerías de Scraping
      run: pip install requests beautifulsoup4
    - name: 🤖 Ejecutar Scraper Real
      run: python scraper.py
    - name: 💾 Guardar resultados
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/resultados.json
        git commit -m "Actualización real de depas" || exit 0 
        git push